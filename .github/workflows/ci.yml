name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without code changes; check weekly.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: build without cgo (any host)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./examples/site

  # The build package has Windows-specific code (build lock, dist swap).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./build/...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fails on vulnerabilities the code can reach, in dependencies and
      # in the standard library of the pinned toolchain.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  c4-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate architecture/workspace.dsl
        # Pinned digest of structurizr/structurizr 6.2.4.
        run: docker run --rm -v "$PWD/architecture:/w" structurizr/structurizr@sha256:8aebde645a7cc8d3b9e1e774cd6d75a84ce45d74ae70eb783876182fe7db31a2 validate -w /w/workspace.dsl
