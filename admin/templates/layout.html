{{define "layout"}}<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} · {{end}}baseplate</title>
<link rel="stylesheet" href="{{asset "admin.css"}}">
<script src="{{asset "htmx.min.js"}}" defer></script>
<script src="{{asset "admin.js"}}" defer></script>
<script src="{{asset "alpine.min.js"}}" defer></script>
</head>
{{if .User}}
<body class="app" hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}' data-csrf="{{.CSRF}}">
<aside class="sidebar">
  <a class="brand" href="/admin/"><span class="brand__mark">b</span> baseplate</a>
  <nav class="nav">
    <a class="nav__item {{if eq .Active "dashboard"}}is-active{{end}}" href="/admin/">Übersicht</a>
    <div class="nav__section">Inhalte</div>
    {{range .Nav}}<a class="nav__item {{if eq $.Active .Key}}is-active{{end}}" href="{{.URL}}">{{.Label}}</a>{{end}}
  </nav>
  <div class="sidebar__user">
    <span class="avatar">{{initial .User.Email}}</span>
    <span class="sidebar__email">{{.User.Email}}</span>
    <form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="btn btn--ghost btn--sm" title="Abmelden">Abmelden</button></form>
  </div>
</aside>
<main class="main">
  {{with .Flash}}<div class="toast" x-data="{show: true}" x-show="show" x-init="setTimeout(() => show = false, 6000)">{{.}}</div>{{end}}
  {{template "content" .}}
</main>
</body>
{{else}}
<body class="auth">{{template "content" .}}</body>
{{end}}
</html>{{end}}
