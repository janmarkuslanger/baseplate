{{define "content"}}
<header class="page-head">
  <div><h1>{{t "nav.media"}}</h1><p class="muted">{{t "media.intro"}}</p></div>
  <form method="post" action="/admin/media" enctype="multipart/form-data" x-data>
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label class="btn btn--primary">{{t "media.upload"}}<input type="file" name="file" hidden x-on:change="$el.form.submit()"></label>
  </form>
</header>
{{if .Page}}
<div class="media-grid media-grid--large">
  {{range .Page}}
  <figure class="media-card">
    {{if .IsImage}}<img src="{{.URL}}" alt="" loading="lazy">{{else}}<div class="media-card__file">PDF</div>{{end}}
    <figcaption><span class="mono" title="{{.Name}}">{{.Name}}</span><span class="muted">{{size .Size}}</span>
      <button type="button" class="btn btn--ghost btn--sm" x-data x-on:click="navigator.clipboard.writeText({{json .URL}}); $el.textContent = {{json (t "media.copied")}}">{{t "media.copyURL"}}</button>
    </figcaption>
  </figure>
  {{end}}
</div>
{{else}}
<div class="card empty"><p><strong>{{t "media.empty"}}</strong></p><p class="muted">{{t "media.empty.hint"}}</p></div>
{{end}}
{{end}}
