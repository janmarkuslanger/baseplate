<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}}</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font: 16px/1.6 system-ui, sans-serif; color: #212134; background: #f6f6f9; }
  main { max-width: 480px; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.08); text-align: center; }
  h1 { margin: 0 0 12px; font-size: 24px; }
  ul { text-align: left; color: #d02b20; }
  a { display: inline-block; margin-top: 16px; color: #4945ff; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>{{.Title}}</h1>
  {{with .Message}}<p>{{.}}</p>{{end}}
  {{with .Errors}}<ul>{{range .}}<li>{{.}}</li>{{end}}</ul>{{end}}
  {{with .Back}}<a href="{{.}}">← Zurück zur Seite</a>{{end}}
</main>
</body>
</html>
